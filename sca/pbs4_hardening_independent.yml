policy:
  id: "pbs4_hardening_independent"
  title: "Security Configuration Assessment for PBS4 Server"
  file: "pbs4_hardening_independent"
  name: "Proxmox Backup Server 4 hardening server"
  description: "This document provides prescriptive guidance for establishing a secure configuration posture for Proxmox Backup Server 4"
  references:
    - https://www.proxmox.com/en/products/proxmox-backup-server/overview
    - https://github.com/HomeSecExplorer/Proxmox-Hardening-Guide.git
    - https://wazuh.com

requirements:
  title: "Check PBS4 Server"
  description: "Requirements for running the SCA scan against PBS4 server"
  condition: all
  rules: 
   - 'c:dpkg -s proxmox-backup -> r:Status: install ok'

checks:
  # Security Configuration Assessment for PBS4 Server
  # Check PBS4 Server
  # Enable Debian “non-free-firmware” repositories
  # Enable UEFI Secure Boot
  # Kernel Lockdown (Integrity Mode)
  # Install CPU microcode
  # Maintain a Valid Proxmox Subscription
  # Enable 2FA
  # Datastore Protections. Turn On “verify-new
  # Restrictive permissions on PBS configuration files
  # Ensure that the Proxmox Backup Proxy service is running
  # Check for scheduled verification tasks
  # Check for ZFS pool status
  # ZFS: Check that the pools are ONLINE"
  # Verify that PBS is listening on default port (8007)
  # Kernel: Disable IP Forwarding
  # Verify if API Tokens are defined (Best practice for PVE-to-PBS connection)
  # Ensure no legacy/insecure remote shells are installed
  # ZFS: Alert if the datastore is full (>90%)"
  # ZFS: Check for checksum errors in pools
  # Ensure Fail2Ban is active for API protection
  # Ensure security updates repository is present
  
  - id: 210000
    title: "Enable Debian “non-free-firmware” repositories"
    description: "“Non-free” in Debian refers to software that does not comply with the Debian Free Software Guidelines (DFSG)."
    rationale: "Enable Debian non-free-firmware alongside main and contrib to ensure required firmware and microcode are available."
    remediation: "In /etc/apt/sources.list:
                    deb http://deb.debian.org/debian bookworm main contrib non-free-firmware
                    deb http://deb.debian.org/debian bookworm-updates main contrib non-free-firmware
                    deb http://security.debian.org/debian-security bookworm-security main contrib non-free-firmware "
    condition: "all"
    rules:
      - 'f:/etc/apt/sources.list -> r:non-free-firmware'
      - 'f:/etc/apt/sources.list.d/debian.sources -> r:non-free-firmware'

  - id: 210001
    title: "Install CPU microcode"
    description: "Ensures the latest vendor microcode mitigations and stability fixes are applied at boot."
    rationale: "Addresses CPU errata and security vulnerabilities that cannot be fully fixed by system firmware alone."
    remediation: "Install CPU microcode updates: Intel: apt install intel-microcode, AMD: apt install amd64-microcode. Reboot to apply (microcode is loaded at boot)."
    condition: "any"
    rules:
      - 'c:dpkg -s intel-microcode -> r:Status: install ok'
      - 'c:dpkg -s amd64-microcode -> r:Status: install ok'
  
  - id: 210002
    title: "Enable UEFI Secure Boot"
    description: "Since Proxmox Backup Server 3.1, Secure Boot is supported out of the box via signed packages and integration in proxmox-boot-tool."
    rationale: "Shim bootloader signed by Microsoft, fallback bootloader and MOKManager, signed by Proxmox, Grub EFI bootloader, signed by Proxmox and Kernel image, signed by Proxmox"
    remediation: "Install with apt install shim-signed, , AMD: apt install amd64-microcode. Reboot to apply (microcode is loaded at boot)."
    references:
      -  "https://pbs.proxmox.com/docs/sysadmin.html#secure-boot"
    condition: "all"
    rules:
      - 'c:dpkg -s shim-signed -> r:Status: install ok'
      - 'c:dpkg -s shim-helpers-amd64-signed -> r:Status: install ok'
      - 'c:dpkg -s grub-efi-amd64-signed -> r:Status: install ok'
      - 'c:dpkg -s proxmox-kernel-6.X.Y-Z-pve-signed -> r:Status: install ok'

  - id: 210003
    title: "Kernel Lockdown (Integrity Mode)"
    description: "When Secure Boot is enabled, the parameter lockdown=integrity blocks unsigned kernel modules, restricts access to /dev/mem, and kernel-space tampering, even by a compromised root account."
    rationale: "Defense-in-depth against kernel-level compromise. It prevents root-level users from modifying the running kernel or loading unauthorized code, which severely limits the blast radius of a potential hypervisor breakout"
    remediation: "Confirm Secure Boot: mokutil --sb-state -> should report 'SecureBoot enabled'. Add GRUB parameter: GRUB_CMDLINE_LINUX_DEFAULT=\"quiet lockdown=integrity\" update-grub reboot"
    condition: "any"
    rules:
      - 'f:/sys/kernel/security/lockdown -> r:[integrity] confidentiality none'

  - id: 210004
    title: "Maintain a Valid Proxmox Subscription"
    description: "When Secure Boot is enabled, the parameter lockdown=integrity blocks unsigned kernel modules, restricts access to /dev/mem, and kernel-space tampering, even by a compromised root account."
    rationale: "Subscription provides: 
                Enterprise Repository Access: You gain access to the Proxmox Enterprise Repository, which offers thoroughly tested, highly stable updates and security patches.
                Official Technical Support: Higher tiers include direct ticket-based help from Proxmox engineers to troubleshoot issues and minimize downtime.
                Project Funding: Purchasing a license helps fund the development and maintenance of the open-source platform"
    remediation: "Configuration --> Subscription --> Upload Subscription Key"
    condition: "any"
    rules:
      - 'f:/etc/proxmox-backup/subscription -> !r:^#'

  - id: 210005
    title: "Enable 2FA"
    description: "Two-factor authentication (2FA) adds an additional factor (TOTP or YubiKey OTP) to mitigate password compromise."
    rationale: "Neutralize the risks of compromised passwords by adding an extra layer of security."
    remediation: "Execute proxmox-backup-manager user list. This command will output a table of all server users and will display whether MFA/TFA is configured"
    condition: "any"
    rules:
      - 'f:/etc/proxmox-backup/tfa.json !r:^#'

  - id: 210006
    title: "Datastore Protections. Turn On “verify-new"
    description: "**Forces an **immediate checksum comparison** after every chunk upload."
    rationale: "verify-new if enabled, all new backups will be verified right after completion.
              A snapshot is marked OK only if all blocks match their expected SHA-256 hashes, catching transmission errors or bad sectors before the job completes."
    remediation: "`Datastore --> Options`: **Verify New Backups = Yes**
                 `proxmox-backup-manager datastore update <<datastore>> --verify-new true`"
    condition: "any"
    rules:
      - 'f:/etc/proxmox-backup/datastore.cfg r:^\s*\t*verify-new'

  # Check active service
  - id: 210007
    title: "Ensure that the Proxmox Backup Proxy service is running"
    description: ""
    condition: any
    rules:
      - 'c:systemctl is-active proxmox-backup-proxy -> r:^active'

  # Sensitive configuration file permissions
  - id: 210008
    title: "Restrictive permissions on PBS configuration files"
    description: ""
    condition: all
    rules:
      - 'f:/etc/proxmox-backup/user.cfg -> p:640'
      - 'f:/etc/proxmox-backup/datastore.cfg -> p:640'
      - 'f:/etc/proxmox-backup/priv/shadow.cfg -> p:600'

    # Network security
  - id: 210009
    title: "Verify that PBS is listening on default port (8007)"
    description: ""
    condition: any
    rules:
      - 'c:ss -tlnp -> r::8007'

  # Verify backups
  - id: 210010
    title: "Check for scheduled verification tasks"
    description: ""
    condition: any
    rules:
      - 'f:/etc/proxmox-backup/verification.cfg -> r:schedule'

  # Verify ZFS pool
  - id: 210010
    title: "Check for ZFS pool status"
    description: ""
    condition: any
    rules:
      - 'c:zpool status -> r:DEGRADED|FAULTED'

  # ZFS status 
  - id: 210011 
    title: "ZFS: Check that the pools are ONLINE" 
    description: ""
    condition: all 
    rules: 
      - 'c:zpool status -> r:state: ONLINE' 
      - 'c:zpool status -> !r:DEGRADED|FAULTED|OFFLINE' 

  # Kernel Security 
  - id: 210012 
    title: "Kernel: Disable IP Forwarding" 
    description: ""
    condition: any 
    rules: 
    - 'c:sysctl net.ipv4.ip_forward -> r:0' 

  # Space Monitoring in Datastores 
  - id: 210013 
    title: "ZFS: Alert if the datastore is full (>90%)" 
    description: ""
    condition: none 
    rules: 
      - 'c:zfs list -> r:([9][0-9]%)'

  # API Token Usage
  - id: 210014
    title: "Verify if API Tokens are defined (Best practice for PVE-to-PBS connection)"
    description: ""
    condition: any
    rules:
      - 'f:/etc/proxmox-backup/user.cfg -> r:token'

  # Network Service Hardening
  - id: 210015
    title: "Ensure no legacy/insecure remote shells are installed"
    description: ""
    condition: none
    rules:
      - 'c:dpkg -l -> r:telnet-server'
      - 'c:dpkg -l -> r:rsh-server'
      - 'c:dpkg -l -> r:nis'

  # ZFS Dataset Health (Specific to PBS Datastores)
  - id: 210016
    title: "ZFS: Check for checksum errors in pools"
    description: ""
    condition: none
    rules:
      - 'c:zpool status -> r:READ|WRITE|CKSUM\s+[1-9]'

  # Fail2Ban Presence
  # Since PBS is often targeted by brute force on port 8007
  - id: 210017
    title: "Ensure Fail2Ban is active for API protection"
    description: ""
    condition: any
    rules:
      - 'c:systemctl is-active fail2ban -> r:active'

  # APT Update Policy
  - id: 210018
    title: "Ensure security updates repository is present"
    description: ""
    condition: any
    rules:
      - 'f:/etc/apt/sources.list -> r:deb-security'
      - 'f:/etc/apt/sources.list.d/debian.sources -> r:deb-security'